# 兜底限流（应用层 /api/secret/get 还有更细的按 IP + 提取码失败锁定；
# 这里防止绕过应用直接打 nginx）。zone 定义必须位于 http 上下文，
# 本文件由 envsubst 渲染进 conf.d/，即处于 http{} 内，故可放在此处。
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（对静态页面与代理的 API 均生效，always 保证错误响应也带上）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS 只有在通过 HTTPS 访问时才被浏览器采纳；若前面有 TLS 终结层可保留
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：允许同源资源；style 需 'unsafe-inline'（Vue 的 :style 绑定会生成内联样式）；
    # script 允许 'unsafe-inline' 以放行 index.html 中预置主题的内联脚本。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # 请求体上限（文本上限 10k 字符，前后端都会校验；这里挡住超大 body）
    client_max_body_size 128k;

    # API requests proxy
    # 后端地址来自镜像 ENV（BACKEND_HOST / BACKEND_PORT，见 Dockerfile），
    # 容器启动时由 envsubst 渲染成本文件；渲染后为静态地址，重写语义与写死时一致
    location /api/ {
        limit_req zone=api_rate burst=30 nodelay;
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
