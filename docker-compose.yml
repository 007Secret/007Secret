services:
  frontend:
    container_name: 007secret-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8087:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - 007Secret-network

  backend:
    container_name: 007secret-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 后端配置不在 compose 里声明：镜像 Dockerfile 的 ENV 即为唯一来源
    # （见 backend/Dockerfile）。本地 backend/.env 只服务于手动启动，
    # 容器内由镜像里的 LOAD_DOTENV=false 保证不会读取 .env。
    expose:
      - "8080"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - 007Secret-network

  redis:
    container_name: 007secret-redis
    image: redis:8.2-alpine
    pull_policy: missing
    ports:
      - "6379"
    restart: unless-stopped
    networks:
      - 007Secret-network

networks:
  007Secret-network:
    driver: bridge
