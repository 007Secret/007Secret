services:
  frontend:
    container_name: 007secret-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8087:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - 007Secret-network

  backend:
    container_name: 007secret-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - GIN_MODE=release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - PORT=8080
    expose:
      - "8080"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - 007Secret-network

  redis:
    container_name: 007secret-redis
    image: redis:8.10.1
    pull_policy: missing
    ports:
      - "6379"
    restart: unless-stopped
    networks:
      - 007Secret-network

networks:
  007Secret-network:
    driver: bridge 
